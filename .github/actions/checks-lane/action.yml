name: effect-microvm checks lane
description: effect-microvm's steps for each phase of systemfsoftware's reusable-checks.yml
inputs:
  lane:
    description: plan, static, test, test-after, timings, gate or docs
    required: true
  job:
    description: The test job from the plan, as JSON
    required: false
    default: "{}"
  profile:
    description: Conformance profile, `local` (pull request) or `per-change` (main and the merge queue)
    required: false
    default: per-change
runs:
  using: composite
  steps:
    - if: inputs.lane == 'plan' || inputs.lane == 'timings'
      uses: systemfsoftware/systemfsoftware/.github/actions/sfs-tools@31963d5a6452b488b73f8d559c85e7104dd3b443
      with:
        repository: systemfsoftware/systemfsoftware
        ref: 31963d5a6452b488b73f8d559c85e7104dd3b443
    # A pull request's plan asks turbo which test hashes changed, so it needs the workspace installed.
    - if: inputs.lane == 'plan' && inputs.profile == 'local'
      uses: systemfsoftware/systemfsoftware/.github/actions/install-deps@31963d5a6452b488b73f8d559c85e7104dd3b443
    - if: inputs.lane == 'plan' && inputs.profile != 'local'
      shell: bash -e {0}
      run: corepack enable

    - name: Static lane environment
      if: inputs.lane == 'static'
      shell: bash -e {0}
      run: printf 'CI=true\nOXLINT_FORMAT=github\nTSGO_FORMAT=github-actions\nTURBO_LOG_ORDER=stream\n' >> "$GITHUB_ENV"
    - uses: systemfsoftware/systemfsoftware/.github/actions/install-deps@31963d5a6452b488b73f8d559c85e7104dd3b443
      if: inputs.lane == 'static'
    - uses: cachix/install-nix-action@v31
      if: inputs.lane == 'static' || inputs.lane == 'docs'
    - name: dprint from the flake
      if: inputs.lane == 'static' || inputs.lane == 'docs'
      shell: bash -e {0}
      run: echo "$(nix build --no-link --print-out-paths .#dprint)/bin" >> "$GITHUB_PATH"
    - name: Turbo cache
      if: inputs.lane == 'static'
      uses: actions/cache@v6
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-checks-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-checks-
          turbo-${{ runner.os }}-

    - name: Test lane environment
      if: inputs.lane == 'test'
      shell: bash -e {0}
      run: printf 'CI=true\n' >> "$GITHUB_ENV"
    - name: Local conformance profile
      if: inputs.lane == 'test' && inputs.profile == 'local'
      shell: bash -e {0}
      run: printf 'CONFORMANCE_PROFILE=local\n' >> "$GITHUB_ENV"
    - uses: systemfsoftware/systemfsoftware/.github/actions/install-deps@31963d5a6452b488b73f8d559c85e7104dd3b443
      if: inputs.lane == 'test'
    - uses: systemfsoftware/systemfsoftware/.github/actions/grant-kvm@31963d5a6452b488b73f8d559c85e7104dd3b443
      if: inputs.lane == 'test'
    - name: Turbo cache
      if: inputs.lane == 'test'
      uses: actions/cache@v6
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-test-${{ fromJSON(inputs.job).id }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-test-${{ fromJSON(inputs.job).id }}-
          turbo-${{ runner.os }}-checks-
          turbo-${{ runner.os }}-
    - name: Build
      if: inputs.lane == 'test'
      shell: bash -e {0}
      env:
        FILTERS: ${{ fromJSON(inputs.job).filters }}
      run: corepack pnpm exec turbo run build --output-logs=errors-only --log-order=stream $FILTERS

    # Heavy: the real-microVM integration suites run on main and in the merge queue, never on a pull request.
    - name: microVM integration suites
      if: inputs.lane == 'test-after' && inputs.profile != 'local' && (fromJSON(inputs.job).shard == null || fromJSON(inputs.job).shard.index == 1)
      shell: bash -e {0}
      env:
        FILTERS: ${{ fromJSON(inputs.job).filters }}
      run: corepack pnpm exec turbo run test:integration --concurrency=1 --continue --output-logs=new-only --log-order=stream $FILTERS
