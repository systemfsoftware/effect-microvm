name: CI

# Pull requests run the fast lane: the local conformance profile, and only the packages whose test hash has no
# recent pass. main (and the merge queue) runs the full per-change profile and the heavy suites.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conflicts:
    name: no merge conflicts
    uses: systemfsoftware/systemfsoftware/.github/workflows/conflict-check.yml@31963d5a6452b488b73f8d559c85e7104dd3b443
    with:
      base_ref: ${{ github.event.pull_request.base.ref }}
      head_sha: ${{ github.event.pull_request.head.sha }}
  checks:
    name: build · lint · typecheck · test
    needs: conflicts
    permissions:
      contents: read
      actions: read
    uses: systemfsoftware/systemfsoftware/.github/workflows/reusable-checks.yml@31963d5a6452b488b73f8d559c85e7104dd3b443
    with:
      profile: ${{ github.event_name == 'pull_request' && 'local' || 'per-change' }}
      record: test-timings-${{ github.event_name == 'pull_request' && 'local' || 'per-change' }}
      dry-run: ${{ github.event_name == 'pull_request' && 'corepack pnpm exec turbo run test --dry=json' || '' }}
      node-options: --max-old-space-size=4096
      pnpm: corepack pnpm
      test-flags: --output-logs=new-only --log-order=stream --log-prefix=none
      gate-name: the gate (pnpm check:ci)
      lanes: >-
        [{"id": "static", "name": "static checks (pnpm check:static)", "timeout-minutes": 45, "node-options": "--max-old-space-size=4096", "run": "corepack pnpm check:static",
          "docs-run": "./bin/dprint check"}]
  smoke:
    # Heavy: the real-microVM journeys run on main and on demand, never on a pull request.
    name: smoke · effect-microsandbox journeys (real microVM)
    needs: conflicts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@v31
      - name: Core tarballs
        run: |
          mkdir -p .sfs-deps
          cp -L --no-preserve=mode "$(nix build --no-link --print-out-paths .#sfs-deps)"/*.tgz .sfs-deps/
      - uses: systemfsoftware/systemfsoftware/.github/actions/install-deps@31963d5a6452b488b73f8d559c85e7104dd3b443
      - uses: systemfsoftware/systemfsoftware/.github/actions/grant-kvm@31963d5a6452b488b73f8d559c85e7104dd3b443
      - name: Smoke journeys
        run: |
          set -o pipefail
          corepack pnpm --filter @systemfsoftware/effect-microsandbox smoke 2>&1 | tee /tmp/smoke.log
          grep -q 'all journeys green' /tmp/smoke.log
