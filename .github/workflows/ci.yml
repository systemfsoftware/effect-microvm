name: CI

# One job per pull request. A pull request runs `pnpm check:static`; a Mergify queue draft (head ref
# `mergify/merge-queue/*`) and a push to main run `pnpm check:ci`, the static checks plus the whole test suite, with
# KVM granted because the suites boot microVMs.
# Mergify builds its drafts as pull requests, so there is no merge_group trigger. The squash-message lint
# and the change-intent check are steps of the same job. A newer push to a pull request cancels its older run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: systemfsoftware/systemfsoftware/.github/workflows/reusable-ci.yml@f271b208fd10c56d27380de6bc43f54b9c7ee2a5
    with:
      commitlint: true
      changeset: true
      fast: pnpm check:static
      full: |
        echo 'KERNEL=="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules > /dev/null
        sudo udevadm control --reload-rules
        sudo udevadm trigger
        pnpm check:ci

  smoke:
    # Heavy: the real-microVM journeys run on main and on demand, never before the merge.
    name: smoke · effect-microsandbox journeys (real microVM)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://nix.systemfsoftware.com
            extra-trusted-public-keys = nix-cache-1:wXA8I4DayNW9q6enUyQA/P/nT38pGSTLt374t3gsn7M=
      - name: Grant KVM access
        run: |
          echo 'KERNEL=="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger
      - name: Smoke journeys
        run: |
          nix develop --command bash -euo pipefail -c '
            pnpm install --frozen-lockfile
            pnpm --filter @systemfsoftware/effect-microsandbox smoke 2>&1 | tee /tmp/smoke.log
            grep -q "all journeys green" /tmp/smoke.log'
